services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: campushub
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/schema.sql:/opt/campushub/db/schema.sql:ro
      - ./deploy/mysql/seed.sql:/opt/campushub/db/seed.sql:ro
      - ./src/main/resources/db/migration:/opt/campushub/db/migration:ro
      - ./deploy/mysql/init/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" campushub --batch --skip-column-names -e 'SELECT 1' | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:6.2-alpine
    user: redis
    ports:
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:-6380}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in
          ''|*[!A-Za-z0-9._-]*) echo 'REDIS_PASSWORD must contain only letters, digits, dot, underscore, or hyphen' >&2; exit 1 ;;
        esac
        umask 077
        config="$$(mktemp /tmp/redis.XXXXXX)"
        printf 'appendonly yes\nappendfilename appendonly.aof\ndir /data\nrequirepass %s\n' "$$REDIS_PASSWORD" > "$$config"
        exec redis-server "$$config"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli -h 127.0.0.1 ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PUBLISHED_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/campushub?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      IMAGE_STORAGE_DIR: /app/data/uploads
      ORDER_STREAM_CONSUMER_ENABLED: ${ORDER_STREAM_CONSUMER_ENABLED:-true}
      ORDER_CLAIM_IDLE_MS: ${ORDER_CLAIM_IDLE_MS:-60000}
      ORDER_MAX_ATTEMPTS: ${ORDER_MAX_ATTEMPTS:-5}
      ORDER_CANCELLATION_RECONCILER_ENABLED: ${ORDER_CANCELLATION_RECONCILER_ENABLED:-true}
      SHOP_CACHE_INVALIDATION_WORKER_ENABLED: ${SHOP_CACHE_INVALIDATION_WORKER_ENABLED:-true}
    volumes:
      - app-uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - java
        - -Dloader.main=io.github.frewily.campushub.tools.HealthProbe
        - -cp
        - /app/application.jar
        - org.springframework.boot.loader.PropertiesLauncher
        - http://127.0.0.1:8081/health/ready
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  mysql-data:
  redis-data:
  app-uploads:
