server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
spring:
  profiles:
    default: dev
  application:
    name: campushub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 0
  redis:
    timeout: 2s
    connect-timeout: 2s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jdbc:
    template:
      query-timeout: 2s
mybatis-plus:
  type-aliases-package: io.github.frewily.campushub.entity
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    io.github.frewily.campushub: info
management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8082}
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never
    prometheus:
      enabled: true
  health:
    defaults:
      enabled: false
  metrics:
    enable:
      # No outbound HTTP clients currently exist. Enable only after a safe URI-tag policy is designed.
      http.client.requests: false
    tags:
      application: campushub
    distribution:
      percentiles-histogram:
        http.server.requests: true
campushub:
  images:
    directory: ${IMAGE_STORAGE_DIR:./data/uploads}
    max-bytes: 2097152
    max-pixels: 16000000
  cache:
    invalidation-worker-enabled: ${SHOP_CACHE_INVALIDATION_WORKER_ENABLED:true}
  order:
    stream-consumer-enabled: ${ORDER_STREAM_CONSUMER_ENABLED:true}
    claim-idle-ms: ${ORDER_CLAIM_IDLE_MS:60000}
    max-attempts: ${ORDER_MAX_ATTEMPTS:5}
    cancellation-reconciler-enabled: ${ORDER_CANCELLATION_RECONCILER_ENABLED:true}
