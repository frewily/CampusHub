server:
  port: 8081
spring:
  application:
    name: campushub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: io.github.frewily.campushub.entity # 别名扫描包
logging:
  level:
    io.github.frewily.campushub: debug
campushub:
  cache:
    invalidation-worker-enabled: ${SHOP_CACHE_INVALIDATION_WORKER_ENABLED:true}
  order:
    stream-consumer-enabled: ${ORDER_STREAM_CONSUMER_ENABLED:true}
    claim-idle-ms: ${ORDER_CLAIM_IDLE_MS:60000}
    max-attempts: ${ORDER_MAX_ATTEMPTS:5}
    cancellation-reconciler-enabled: ${ORDER_CANCELLATION_RECONCILER_ENABLED:true}
